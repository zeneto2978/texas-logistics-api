services:
  db:
    image: postgres:16
    container_name: texas-logistics-db
    environment:
      POSTGRES_DB: texas_logistics_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d texas_logistics_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: texas-logistics-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/texas_logistics_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8080:8080"

volumes:
  pgdata:
